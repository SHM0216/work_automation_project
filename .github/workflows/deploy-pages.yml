name: Deploy Pump Dashboard to Pages

on:
  push:
    branches:
      - main
      - claude/setup-pump-backend-hExT4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: pump_system/web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
